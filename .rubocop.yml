require:
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'test/fixtures/**/*'

# Relaxed settings for existing code
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 200

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'Rakefile'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*'

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Allow both styles during migration
Style/HashSyntax:
  EnforcedShorthandSyntax: either

Naming/MethodParameterName:
  AllowedNames:
    - f
    - t
    - to
    - id
